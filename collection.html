<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>小宝专属</title>
  <meta property="og:title" content="小宝专属" />
  <meta property="og:description" content="点亮你拥有的宝宝吧！(๑•̀∀•́ฅ ✧" />
  <meta property="og:image" content="https://i.postimg.cc/dV18mp5f/image.png" />
  <link rel="icon" href="https://i.postimg.cc/3R7nNT0k/icon.png" type="image/png" />
  <link rel="apple-touch-icon" href="https://i.postimg.cc/L55pFY4d/chiikawaicon.png" />
  <meta name="theme-color" content="#fdf6f0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <style>
    :root {
      --accent: #d77485;
      --bg: #fdf6f0;
      --page-bg-image: radial-gradient(circle at 12% 12%, rgba(255,236,243,0.96) 0, rgba(255,236,243,0.58) 28%, transparent 42%), radial-gradient(circle at 86% 8%, rgba(226,242,255,0.86) 0, rgba(226,242,255,0.5) 26%, transparent 44%), linear-gradient(135deg, rgba(252,228,236,0.96) 0%, rgba(253,246,240,0.9) 52%, rgba(227,240,251,0.92) 100%);
      --page-bg-opacity: 0.72;
      --card-bg: rgba(255,255,255,0.9);
      --text: #333;
      --subtext: #888;
      --border: #e8d5c4;
      --header-bg: #fff9f5;
      --shadow: 0 2px 12px rgba(215,116,133,0.10);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%;
      font-family: 'Microsoft YaHei', 'Noto Sans SC', 'Source Han Sans SC', 'PingFang SC', 'Hiragino Sans GB', 'Segoe UI', Arial, sans-serif;
      background-color: #fdf6f0;
      background-image: var(--page-bg-image);
      background-position: center center;
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: var(--text);
      overflow-x: hidden;
      min-height: 100vh;
    }
    button, input, select, textarea {
      font: inherit;
    }

    /* Fixed background image - Onsen scene */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: transparent;
      background-image: var(--page-bg-image);
      background-position: center center;
      background-size: cover;
      background-repeat: no-repeat;
      z-index: 0;
      opacity: var(--page-bg-opacity);
      pointer-events: none;
    }

    /* ===== HEADER ===== */
    .header {
      background: linear-gradient(135deg, rgba(255, 249, 245, 0.86), rgba(248, 252, 255, 0.76));
      border-bottom: 1px solid var(--border);
      padding: 12px 16px 0 16px;
      position: sticky;
      top: 0;
      z-index: 200;
      box-shadow: 0 14px 34px rgba(126, 90, 105, 0.1);
      backdrop-filter: blur(18px) saturate(1.18);
    }
    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      gap: 10px;
    }
    .header-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .header-brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 6px 10px;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(255,255,255,0.88), rgba(255,246,250,0.72));
      border: 1px solid rgba(232, 213, 196, 0.9);
      box-shadow: 0 8px 20px rgba(126, 90, 105, 0.08);
    }
    .header-brand-icon {
      width: 42px;
      height: 42px;
      object-fit: contain;
      flex-shrink: 0;
      border-radius: 50%;
      background: rgba(255,255,255,0.88);
      padding: 3px;
      box-shadow: inset 0 0 0 1px rgba(232, 213, 196, 0.9);
    }
    .header-brand-copy {
      display: flex;
      flex-direction: column;
      line-height: 1.05;
    }
    .header-brand-name {
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.14em;
      color: #7b6256;
      white-space: nowrap;
    }
    .header-brand-sub {
      font-size: 10px;
      font-weight: 700;
      color: #b59c90;
      margin-top: 2px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    .header-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--accent);
      white-space: nowrap;
    }

    /* ===== OVERALL STATS BAR ===== */
    .stats-banner {
      background: linear-gradient(135deg, rgba(252,228,236,0.92) 0%, rgba(253,246,240,0.86) 58%, rgba(227,240,251,0.92) 100%);
      border-radius: 14px;
      padding: 10px 16px;
      margin: 0 0 8px 0;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      border: 1px solid rgba(255,255,255,0.72);
      box-shadow: 0 14px 30px rgba(126, 90, 105, 0.08);
    }
    .stats-banner .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 56px;
    }
    .stats-banner .stat-num {
      font-size: 22px;
      font-weight: 800;
      color: var(--accent);
      line-height: 1;
    }
    .stats-banner .stat-label {
      font-size: 10px;
      color: var(--subtext);
      margin-top: 2px;
    }
    .stats-bar-wrap {
      flex: 1;
      min-width: 120px;
    }
    .stats-bar-track {
      background: #f0e0e8;
      border-radius: 99px;
      height: 10px;
      overflow: hidden;
    }
    .stats-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #d77485, #f9be3c);
      border-radius: 99px;
      transition: width 0.6s cubic-bezier(.4,0,.2,1);
    }
    .stats-percent {
      font-size: 11px;
      color: var(--accent);
      font-weight: 700;
      margin-top: 3px;
      text-align: right;
    }

    /* ===== SEARCH & FILTER ===== */
    .toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 6px 0 10px 0;
      flex-wrap: wrap;
    }
    .search-wrap {
      flex: 1;
      min-width: 120px;
      position: relative;
    }
    .search-wrap input {
      width: 100%;
      padding: 7px 12px 7px 32px;
      border: 1.5px solid var(--border);
      border-radius: 99px;
      font-size: 13px;
      outline: none;
      background: #fff;
      color: var(--text);
      transition: border-color 0.2s;
    }
    .search-wrap input:focus { border-color: var(--accent); }
    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--subtext);
      font-size: 14px;
      pointer-events: none;
    }
    .filter-btns {
      display: flex;
      gap: 4px;
    }
    .filter-btn {
      padding: 6px 14px;
      border-radius: 99px;
      border: 1.5px solid var(--border);
      background: #fff;
      color: var(--subtext);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .filter-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .quick-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      padding: 0 0 10px 0;
    }
    .quick-action-btn {
      border: 1px solid rgba(255,255,255,0.78);
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(255,255,255,0.92), rgba(255,246,250,0.82));
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      padding: 8px 14px;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(215,116,133,0.08);
      backdrop-filter: blur(10px);
      transition: transform 0.18s, box-shadow 0.18s, background 0.18s;
    }
    .quick-action-btn.primary-action {
      color: #fff;
      background: linear-gradient(135deg, #d77485, #7f9dd9);
      border-color: rgba(255,255,255,0.72);
      box-shadow: 0 14px 28px rgba(215,116,133,0.22);
    }
    .quick-action-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 20px rgba(215,116,133,0.14);
    }
    .quick-action-btn:active {
      transform: scale(0.98);
    }

    /* ===== CHARACTER TABS ===== */
    .char-tabs-wrap {
      display: flex;
      overflow-x: auto;
      gap: 0;
      padding: 2px 0 4px 0;
      scrollbar-width: none;
    }
    .char-tabs-wrap::-webkit-scrollbar { display: none; }
    .char-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      padding: 4px 10px;
      flex-shrink: 0;
      transition: transform 0.15s;
      user-select: none;
      border-bottom: 3px solid transparent;
    }
    .char-tab:active { transform: scale(0.94); }
    .char-tab.active { border-bottom-color: var(--tab-color, var(--accent)); }
    .char-tab-ring {
      position: relative;
      width: 54px;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .char-tab-ring img {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
    }
    .char-tab-ring svg {
      position: absolute;
      top: 0; left: 0;
      width: 54px; height: 54px;
      transform: rotate(-90deg);
      pointer-events: none;
    }
    .char-tab-name {
      font-size: 11px;
      font-weight: 700;
      color: var(--text);
      margin-top: 2px;
    }
    .char-tab-count {
      font-size: 9px;
      color: var(--subtext);
    }

    /* ===== TYPE NAVIGATION ===== */
    .type-nav {
      display: flex;
      overflow-x: auto;
      gap: 6px;
      padding: 4px 16px;
      scrollbar-width: none;
      background: rgba(255, 249, 245, 0.76);
      border-bottom: 1px solid var(--border);
      position: relative;
      z-index: 10;
      backdrop-filter: blur(12px);
    }
    .type-nav::-webkit-scrollbar { display: none; }
    .type-nav-item {
      padding: 4px 12px;
      border-radius: 99px;
      border: 1px solid var(--border);
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
      background: #fff;
      color: var(--subtext);
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .type-nav-item.active, .type-nav-item:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    /* ===== MAIN CONTENT ===== */
    .main {
      padding: 16px 12px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* ===== SECTION HEADER ===== */
    .section-header {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin: 20px 0 10px 0;
      scroll-margin-top: 260px;
    }
    .section-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--text);
    }
    .section-badge {
      font-size: 11px;
      color: var(--subtext);
      background: #f2e9e4;
      padding: 2px 8px;
      border-radius: 99px;
    }
    .section-badge .owned { color: var(--accent); font-weight: 700; }

    /* ===== CARD GRID ===== */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 10px;
    }
    @media (max-width: 480px) {
      .card-grid { grid-template-columns: repeat(4, 1fr); gap: 7px; }
    }
    @media (min-width: 768px) {
      .card-grid { grid-template-columns: repeat(auto-fill, 130px); }
    }

    /* ===== CARD ===== */
    .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(255,249,246,0.9));
      border-radius: 18px;
      border: 1px solid rgba(224,208,200,0.88);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      position: relative;
      overflow: hidden;
      text-align: center;
      user-select: none;
      box-shadow: 0 10px 26px rgba(126, 90, 105, 0.08);
      backdrop-filter: blur(10px);
    }
    .card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.10); }
    .card:active { transform: scale(0.96); }

    /* Unlit / not collected */
    .card:not(.collected) .card-img-wrap { filter: grayscale(100%) opacity(0.45); }
    .card:not(.collected) { opacity: 0.7; }

    /* Lit / collected */
    .card.collected {
      border-color: color-mix(in srgb, var(--card-color, var(--accent)) 70%, #ffffff);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--card-color, var(--accent)) 52%, #ffffff), 0 14px 30px rgba(215,116,133,0.2);
      opacity: 1;
    }
    .card.collected .card-img-wrap { filter: none; }

    .card-img-wrap {
      padding: 8px 8px 4px 8px;
      transition: filter 0.35s;
    }
    .card-img-wrap img {
      width: 100%;
      height: 90px;
      object-fit: contain;
      display: block;
      -webkit-touch-callout: none;
    }
    @media (min-width: 768px) {
      .card-img-wrap img { height: 110px; }
    }

    .card-name {
      font-size: 10px;
      font-weight: 700;
      color: var(--text);
      padding: 0 4px;
      line-height: 1.3;
      word-break: break-word;
      white-space: normal;
      min-height: 14px;
    }
    .card-size {
      font-size: 9px;
      color: var(--subtext);
      padding: 1px 4px 3px 4px;
    }
    .card-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 2px 4px 6px 4px;
      border-top: 1px dashed var(--border);
      margin-top: 2px;
    }
    .card-price {
      font-size: 10px;
      color: #e67e22;
      font-weight: 600;
    }
    .card-date {
      font-size: 9px;
      color: var(--subtext);
    }
    .card-actions {
      padding: 0 6px 8px 6px;
      display: flex;
      gap: 4px;
    }
    .card-action-btn {
      flex: 1;
      min-width: 0;
      border: 1px solid var(--border);
      border-radius: 99px;
      background: #fff;
      color: var(--accent);
      font-size: 10px;
      font-weight: 700;
      padding: 5px 6px;
      cursor: pointer;
      white-space: nowrap;
    }
    .card-action-btn:active {
      transform: scale(0.98);
    }
    .card-wishlist-btn {
      flex: 1;
      min-width: 0;
      border: 1px solid #efd7b1;
      border-radius: 99px;
      background: #fff9ee;
      color: #b27625;
      font-size: 10px;
      font-weight: 700;
      padding: 5px 6px;
      cursor: pointer;
      white-space: nowrap;
    }
    .card-wishlist-btn.active {
      background: #fff1d6;
      color: #9f6418;
      border-color: #f0c982;
    }
    .card-uncollect-btn {
      flex: 0 0 auto;
      border: 1px solid #e8c4c4;
      border-radius: 99px;
      background: #fff5f5;
      color: #c47474;
      font-size: 10px;
      font-weight: 700;
      padding: 5px 8px;
      cursor: pointer;
      white-space: nowrap;
      display: none;
    }
    .card-uncollect-btn:active {
      transform: scale(0.98);
    }
    .card.collected .card-uncollect-btn {
      display: block;
    }
    @media (min-width: 768px) {
      .card-name { font-size: 12px; }
      .card-size { font-size: 10px; }
      .card-price { font-size: 11px; }
      .card-date { font-size: 10px; }
    }

    /* Checkmark badge */
    .card-check {
      position: absolute;
      top: 5px; right: 5px;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: var(--card-color, var(--accent));
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
      transition: transform 0.2s;
      pointer-events: none;
    }
    .card.collected .card-check {
      display: flex;
      animation: popIn 0.25s cubic-bezier(.4,0,.2,1);
    }
    .card-check svg { width: 11px; height: 11px; fill: #fff; }
    @keyframes popIn {
      from { transform: scale(0); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }

    /* Spark animation when collecting */
    .card.just-collected::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, rgba(255,255,255,0.7) 0%, transparent 70%);
      animation: sparkle 0.4s ease-out forwards;
      pointer-events: none;
      border-radius: 10px;
    }
    @keyframes sparkle {
      from { opacity: 1; transform: scale(0.8); }
      to   { opacity: 0; transform: scale(1.1); }
    }

    /* ===== EMPTY STATE ===== */
    .empty-state {
      text-align: center;
      padding: 48px 16px;
      color: var(--subtext);
    }
    .empty-state .emoji { font-size: 48px; display: block; margin-bottom: 8px; }
    .overlay-modal {
      position: fixed;
      inset: 0;
      background: rgba(72, 49, 58, 0.56);
      z-index: 1200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      backdrop-filter: blur(6px);
    }
    .overlay-panel {
      width: min(100%, 920px);
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 24px;
      background: rgba(255,255,255,0.96);
      border: 1px solid rgba(255,255,255,0.7);
      box-shadow: 0 24px 60px rgba(65, 38, 50, 0.22);
    }
    .overlay-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 22px 22px 16px 22px;
      background: linear-gradient(135deg, rgba(255,246,250,0.96), rgba(243,250,255,0.94));
      border-bottom: 1px solid rgba(223, 204, 204, 0.7);
    }
    .overlay-title {
      font-size: 20px;
      font-weight: 800;
      color: #5f3f3a;
      margin: 0;
    }
    .overlay-subtitle {
      font-size: 13px;
      color: #8a6b74;
      margin-top: 6px;
      line-height: 1.5;
    }
    .overlay-close {
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 999px;
      background: rgba(255,255,255,0.92);
      color: #8c6a6a;
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
      flex-shrink: 0;
    }
    .overlay-body {
      padding: 18px 22px 22px 22px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .overlay-footer {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      padding: 16px 22px 22px 22px;
      border-top: 1px solid rgba(230, 223, 223, 0.75);
      background: rgba(250,248,248,0.92);
    }
    .ghost-btn,
    .solid-btn {
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid var(--border);
    }
    .ghost-btn {
      background: #fff;
      color: var(--accent);
    }
    .solid-btn {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .summary-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .summary-chip {
      min-width: 110px;
      padding: 12px 14px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(252,228,236,0.78), rgba(255,255,255,0.92));
      border: 1px solid rgba(228, 213, 196, 0.9);
      box-shadow: 0 6px 18px rgba(215,116,133,0.08);
    }
    .summary-chip strong {
      display: block;
      font-size: 20px;
      color: #5f3f3a;
      margin-bottom: 3px;
    }
    .summary-chip span {
      font-size: 11px;
      color: #8a6b74;
    }
    .showcase-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
    }
    .showcase-card {
      background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(250,244,244,0.96));
      border-radius: 18px;
      border: 1px solid rgba(233, 217, 217, 0.95);
      overflow: hidden;
      box-shadow: 0 14px 28px rgba(126, 90, 105, 0.08);
    }
    .showcase-card img {
      width: 100%;
      height: 150px;
      object-fit: contain;
      display: block;
      background: rgba(255,255,255,0.84);
      padding: 16px;
    }
    .showcase-card-body {
      padding: 14px 14px 16px 14px;
    }
    .showcase-card-title {
      font-size: 14px;
      font-weight: 800;
      color: #5f3f3a;
      line-height: 1.35;
    }
    .showcase-card-sub {
      font-size: 12px;
      color: #8a6b74;
      margin-top: 4px;
    }
    .showcase-card-meta {
      font-size: 11px;
      color: #90757e;
      margin-top: 8px;
      line-height: 1.5;
    }
    .timeline-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .timeline-item {
      display: grid;
      grid-template-columns: 16px 56px minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 14px 16px;
      border-radius: 18px;
      background: rgba(255,255,255,0.88);
      border: 1px solid rgba(231, 220, 220, 0.95);
    }
    .timeline-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: linear-gradient(135deg, #d77485, #f9be3c);
      box-shadow: 0 0 0 4px rgba(215,116,133,0.12);
    }

function toSimplifiedText(value) {
  const text = String(value ?? '');
  if (!text) return '';
  return Object.entries(SIMPLIFIED_TEXT_MAP).reduce((result, [traditional, simplified]) => {
    return result.split(traditional).join(simplified);
  }, text);
}

        function getSheetLabel(sheetName) {
          return toSimplifiedText(SHEET_LABELS[sheetName] || sheetName);
        }

        /* ========== STATE ========== */
        let currentSheet = "吉伊";
        let currentFilter = "all";
        let searchQuery = "";
        let allData = {};     // sheetName -> [{type,name,itemCode,imgUrl,productUrl,size,jpName}]
        let tabEls = {};      // sheetName -> tab DOM el
        let sheetFetchPromises = {};
        let sheetSynced = {};

        /* ========== STORAGE HELPERS ========== */
        function storageKey(sheet) { return `collected_v2_${sheet}`; }
        function dataCacheKey(sheet) { return `collection_sheet_cache_${sheet}`; }
        const CUSTOM_BACKGROUND_STORAGE_KEY = 'collectionBackground';
        const BACKGROUND_OPACITY_STORAGE_KEY = 'collectionBackgroundOpacity';
        const DEFAULT_BACKGROUND_OPACITY = 0.72;
        const BACKGROUND_STORAGE_KEYS = [
          CUSTOM_BACKGROUND_STORAGE_KEY,
          'siteBackground',
          'customBackground',
          'bgImage',
          'backgroundImage',
          'pageBackground'
        ];
        const DEFAULT_BACKGROUND_VALUE = "linear-gradient(135deg, rgba(252,228,236,0.96) 0%, rgba(253,246,240,0.9) 52%, rgba(227,240,251,0.92) 100%)";
        function purchaseStorageKey() { return "collection_purchase_records_v1"; }
        function wishlistStorageKey() { return "collection_wishlist_records_v1"; }
        function getItemKey(sheet, type, name) { return `${sheet}|${type}|${name}`; }
        function getCollected(sheet) {
          try {
            const raw = localStorage.getItem(storageKey(sheet));
            const parsed = raw ? JSON.parse(raw) : [];
            return Array.isArray(parsed) ? parsed : [];
          } catch {
            return [];
          }
        }
        function setCollected(sheet, arr) {
          try {
            const next = Array.from(new Set(Array.isArray(arr) ? arr : []));
            localStorage.setItem(storageKey(sheet), JSON.stringify(next));
          } catch {}
        }
        function isCollected(sheet, type, name) {
          return getCollected(sheet).includes(getItemKey(sheet, type, name));
        }
        function toggleCollected(sheet, type, name) {
          let c = getCollected(sheet);
          const key = getItemKey(sheet, type, name);
          if (c.includes(key)) { c = c.filter(k => k !== key); }
          else { c.push(key); }
          setCollected(sheet, c);
          return c.includes(key);
        }
        function getAllPurchaseRecords() {
          try {
            const raw = localStorage.getItem(purchaseStorageKey());
            const parsed = raw ? JSON.parse(raw) : {};
            return parsed && typeof parsed === "object" && !Array.isArray(parsed) ? parsed : {};
          } catch {
            return {};
          }
        }
        function getPurchaseRecord(sheet, type, name) {
          const record = getAllPurchaseRecords()[getItemKey(sheet, type, name)] || {};
          return {
            price: String(record.price || "").trim(),
            date: String(record.date || "").trim()
          };
        }
        function setPurchaseRecord(sheet, type, name, record) {
          const records = getAllPurchaseRecords();
          const key = getItemKey(sheet, type, name);
          const next = {
            price: String(record?.price || "").trim(),
            date: String(record?.date || "").trim()
          };
          if (!next.price && !next.date) delete records[key];
          else records[key] = next;
          try {
            localStorage.setItem(purchaseStorageKey(), JSON.stringify(records));
          } catch {}
        }

        function getAllWishlistRecords() {
          try {
            const raw = localStorage.getItem(wishlistStorageKey());
            const parsed = raw ? JSON.parse(raw) : {};
            return parsed && typeof parsed === "object" && !Array.isArray(parsed) ? parsed : {};
          } catch {
            return {};
          }
        }

        function getWishlistRecord(sheet, type, name) {
          const record = getAllWishlistRecords()[getItemKey(sheet, type, name)] || {};
          return {
            targetPrice: String(record.targetPrice || "").trim(),
            planDate: String(record.planDate || "").trim(),
            priority: String(record.priority || "普通").trim() || "普通",
            note: String(record.note || "").trim(),
            createdAt: String(record.createdAt || "").trim()
          };
        }

        function isWishlisted(sheet, type, name) {
          return Boolean(getAllWishlistRecords()[getItemKey(sheet, type, name)]);
        }

        function setWishlistRecord(sheet, type, name, record) {
          const records = getAllWishlistRecords();
          records[getItemKey(sheet, type, name)] = {
            targetPrice: String(record?.targetPrice || "").trim(),
            planDate: String(record?.planDate || "").trim(),
            priority: String(record?.priority || "普通").trim() || "普通",
            note: String(record?.note || "").trim(),
            createdAt: String(record?.createdAt || new Date().toISOString()).trim()
          };
          try {
            localStorage.setItem(wishlistStorageKey(), JSON.stringify(records));
          } catch {}
        }

        function removeWishlistRecord(sheet, type, name) {
          const records = getAllWishlistRecords();
          delete records[getItemKey(sheet, type, name)];
          try {
            localStorage.setItem(wishlistStorageKey(), JSON.stringify(records));
          } catch {}
        }

function normalizeSheetItem(item) {
  if (!item || typeof item !== "object") return null;
  const type = String(item.type || "").trim();
  const name = String(item.name || "").trim();
  if (!name || (type === "類型" && name === "名稱")) return null;
  return {
    type: type || "无类型",
    name,
    itemCode: String(item.itemCode ?? item.price ?? "").trim(),
    imgUrl: String(item.imgUrl || "").trim(),
    productUrl: String(item.productUrl ?? item.date ?? "").trim(),
    size: String(item.size || "").trim(),
    jpName: String(item.jpName || "").trim()
  };
}

function getCachedSheetData(sheet) {
  try {
    const raw = localStorage.getItem(dataCacheKey(sheet));
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed)
      ? parsed.map(normalizeSheetItem).filter(Boolean)
      : [];
  } catch {
    return [];
  }
}

function setCachedSheetData(sheet, data) {
  try {
    const normalized = Array.isArray(data) ? data.map(normalizeSheetItem).filter(Boolean) : [];
    localStorage.setItem(dataCacheKey(sheet), JSON.stringify(normalized));
  } catch {}
}

function parsePriceValue(price) {
  if (price === null || price === undefined) return 0;
  const normalized = String(price).replace(/,/g, '').trim();
  if (!normalized) return 0;
  const match = normalized.match(/\d+(?:\.\d+)?/);
  if (!match) return 0;
  const value = parseFloat(match[0]);
  return Number.isFinite(value) ? value : 0;
}

function formatCurrency(amount) {
  if (!Number.isFinite(amount) || amount <= 0) return '¥0';
  if (amount >= 10000) return `¥${(amount / 10000).toFixed(1)}w`;
  const text = Number.isInteger(amount) ? String(amount) : amount.toFixed(2).replace(/\.?0+$/, '');
  return `¥${text}`;
}

function formatPurchasePrice(price) {
  const raw = String(price ?? '').trim();
  if (!raw) return '';
  if (/^[¥￥$]/.test(raw)) return raw;
  const value = parsePriceValue(raw);
  return Number.isFinite(value) ? formatCurrency(value) : raw;
}

function extractBackgroundCandidates(value) {
  if (!value) return [];
  const raw = String(value).trim();
  if (!raw) return [];
  if ((raw.startsWith('{') && raw.endsWith('}')) || (raw.startsWith('[') && raw.endsWith(']'))) {
    try {
      const parsed = JSON.parse(raw);
      if (typeof parsed === 'string') return [parsed];
      if (parsed && typeof parsed === 'object') {
        return [parsed.url, parsed.src, parsed.image, parsed.value, parsed.background, parsed.path].filter(Boolean).map(String);
      }
    } catch {}
  }
  return [raw];
}

function normalizeBackgroundValue(value) {
  const raw = String(value ?? '').trim();
  if (!raw) return '';
  if (/^url\(/i.test(raw) || /gradient\(/i.test(raw)) return raw;
  const unquoted = raw.replace(/^['"]|['"]$/g, '');
  if (
    /^(https?:\/\/|data:image\/|blob:)/i.test(unquoted) ||
    /^[./]/.test(unquoted) ||
    /\.(png|jpe?g|gif|webp|svg)(\?.*)?$/i.test(unquoted)
  ) {
    const safeValue = unquoted.replace(/"/g, '\\"');
    return `url("${safeValue}")`;
  }
  return '';
}

function clampNumber(value, min, max) {
  return Math.min(max, Math.max(min, value));
}

function getStoredBackgroundValue() {
  const candidates = [];
  BACKGROUND_STORAGE_KEYS.forEach(key => {
    extractBackgroundCandidates(localStorage.getItem(key)).forEach(candidate => candidates.push(candidate));
  });
  return candidates.map(normalizeBackgroundValue).find(Boolean) || DEFAULT_BACKGROUND_VALUE;
}

function getBackgroundOpacity() {
  try {
    const raw = parseFloat(localStorage.getItem(BACKGROUND_OPACITY_STORAGE_KEY));
    return Number.isFinite(raw) ? clampNumber(raw, 0.35, 1) : DEFAULT_BACKGROUND_OPACITY;
  } catch {
    return DEFAULT_BACKGROUND_OPACITY;
  }
}

function setBackgroundOpacity(value) {
  const next = clampNumber(Number(value) || DEFAULT_BACKGROUND_OPACITY, 0.35, 1);
  try {
    localStorage.setItem(BACKGROUND_OPACITY_STORAGE_KEY, String(next));
  } catch {}
  return next;
}

function setCustomBackgroundValue(value) {
  const raw = String(value ?? '').trim();
  try {
    if (raw) localStorage.setItem(CUSTOM_BACKGROUND_STORAGE_KEY, raw);
    else localStorage.removeItem(CUSTOM_BACKGROUND_STORAGE_KEY);
    applyStoredBackground();
    return true;
  } catch {
    return false;
  }
}

function clearCustomBackgroundValue() {
  try {
    localStorage.removeItem(CUSTOM_BACKGROUND_STORAGE_KEY);
    applyStoredBackground();
    return true;
  } catch {
    return false;
  }
}

function describeCurrentBackground(value) {
  if (!value || value === DEFAULT_BACKGROUND_VALUE) return '当前使用默认柔和渐变背景';
  if (/^url\(/i.test(value)) return '当前使用你导入的图片背景';
  if (/gradient\(/i.test(value)) return '当前使用渐变背景';
  return '当前已应用自定义背景';
}

function applyStoredBackground() {
  const selected = getStoredBackgroundValue();
  const opacity = getBackgroundOpacity();
  document.documentElement.style.setProperty('--page-bg-image', selected);
  document.documentElement.style.setProperty('--page-bg-opacity', opacity.toFixed(2));
  document.body.style.backgroundImage = selected;
  document.body.style.backgroundAttachment = 'fixed';
  const preview = document.getElementById('bg-preview-image');
  if (preview) {
    preview.style.backgroundImage = selected;
    preview.style.opacity = opacity.toFixed(2);
  }
  const label = document.getElementById('bg-preview-label');
  if (label) label.textContent = describeCurrentBackground(selected);
  const opacityInput = document.getElementById('bg-opacity-input');
  if (opacityInput) opacityInput.value = String(Math.round(opacity * 100));
  const opacityValue = document.getElementById('bg-opacity-value');
  if (opacityValue) opacityValue.textContent = `${Math.round(opacity * 100)}%`;
}

function readFileAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result || ''));
    reader.onerror = () => reject(new Error('read_failed'));
    reader.readAsDataURL(file);
  });
}

function downscaleBackgroundDataUrl(dataUrl) {
  return new Promise((resolve, reject) => {
    const image = new Image();
    image.onload = () => {
      const maxWidth = 1600;
      const ratio = image.width > maxWidth ? maxWidth / image.width : 1;
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(image.width * ratio));
      canvas.height = Math.max(1, Math.round(image.height * ratio));
      const context = canvas.getContext('2d');
      if (!context) {
        resolve(dataUrl);
        return;
      }
      context.drawImage(image, 0, 0, canvas.width, canvas.height);
      try {
        resolve(canvas.toDataURL('image/jpeg', 0.92));
      } catch {
        resolve(dataUrl);
      }
    };
    image.onerror = () => reject(new Error('image_parse_failed'));
    image.src = dataUrl;
  });
}

function importBackgroundFile(file) {
  return readFileAsDataUrl(file).then(downscaleBackgroundDataUrl);
}

function escapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function closeOverlayModal(modalId) {
  const modal = document.getElementById(modalId);
  if (modal) modal.remove();
}

function createOverlayModal(modalId, title, subtitle = '') {
  closeOverlayModal(modalId);

  modal.innerHTML = `
    <div class="overlay-panel">
      <div class="overlay-header">

      </div>
      <div class="overlay-body"></div>
      <div class="overlay-footer"></div>
    </div>
  `;
  const close = () => modal.remove();
  modal.addEventListener('click', event => {
    if (event.target === modal) close();
  });
  modal.querySelector('.overlay-close').addEventListener('click', close);
  document.body.appendChild(modal);
  return {

}

function parsePurchaseDateValue(value) {
  const raw = String(value ?? '').trim();
  if (!raw) return 0;
  const normalized = raw.replace(/[./]/g, '-');
  const parsed = Date.parse(normalized);
  return Number.isFinite(parsed) ? parsed : 0;
}

function getCollectedItems() {
  const collected = [];
  SHEET_NAMES.forEach(s => {
    const source = (allData[s] && allData[s].length) ? allData[s] : getCachedSheetData(s);
    if ((!allData[s] || !allData[s].length) && source.length) {
      allData[s] = source;
    }
    const c = getCollected(s);
    source.forEach(it => {
      if (c.includes(getItemKey(s, it.type, it.name))) {
        const purchase = getPurchaseRecord(s, it.type, it.name);
        collected.push({
          ...it,
          sheet: s,
          sheetLabel: getSheetLabel(s),
          displayName: toSimplifiedText(it.name),
          displayType: toSimplifiedText(it.type),
          displaySize: toSimplifiedText(it.size),
          purchasePrice: purchase.price,
          purchaseDate: purchase.date
        });
      }
    });
  });
  return collected;
}

function getWishlistItems() {
  const records = getAllWishlistRecords();
  const items = [];
  Object.keys(records).forEach(key => {
    const [sheet, type, name] = key.split('|');
    const source = (allData[sheet] && allData[sheet].length) ? allData[sheet] : getCachedSheetData(sheet);
    const found = source.find(it => it.type === type && it.name === name) || { type, name, imgUrl: '', size: '' };
    const record = getWishlistRecord(sheet, type, name);
    items.push({
      ...found,
      key,
      sheet,
      sheetLabel: getSheetLabel(sheet),
      displayName: toSimplifiedText(found.name || name),
      displayType: toSimplifiedText(found.type || type),
      targetPrice: record.targetPrice,
      planDate: record.planDate,
      priority: record.priority,
      note: record.note,
      createdAt: record.createdAt
    });
  });
  return items.sort((a, b) => {
    const priorityRank = { "高": 3, "普通": 2, "低": 1 };
    const rankDiff = (priorityRank[b.priority] || 2) - (priorityRank[a.priority] || 2);
    if (rankDiff) return rankDiff;
    return parsePurchaseDateValue(a.planDate) - parsePurchaseDateValue(b.planDate);
  });
}

function editWishlistRecord(sheet, type, item) {
  const current = getWishlistRecord(sheet, type, item.name);
  const itemLabel = toSimplifiedText(item.name);
  const targetPrice = window.prompt(`请输入「${itemLabel}」的预算/目标价（留空可跳过，输入 - 可清除）`, current.targetPrice);
  if (targetPrice === null) return false;
  const planDate = window.prompt(`请输入计划入手日期（如 2026-05-20，留空可跳过，输入 - 可清除）`, current.planDate);
  if (planDate === null) return false;
  const priority = window.prompt(`请输入优先级：高 / 普通 / 低`, current.priority || "普通");
  if (priority === null) return false;
  const note = window.prompt(`写一点备注吧（店铺、版本、尺寸等；留空可跳过，输入 - 可清除）`, current.note);
  if (note === null) return false;
  setWishlistRecord(sheet, type, item.name, {
    targetPrice: String(targetPrice).trim() === '-' ? '' : String(targetPrice).trim(),
    planDate: String(planDate).trim() === '-' ? '' : String(planDate).trim(),
    priority: ["高", "普通", "低"].includes(String(priority).trim()) ? String(priority).trim() : "普通",
    note: String(note).trim() === '-' ? '' : String(note).trim(),
    createdAt: current.createdAt || new Date().toISOString()
  });
  return true;
}

function getShowcaseItems(collected, limit = 8) {

      if (dateDiff) return dateDiff;
      const priceDiff = parsePriceValue(b.purchasePrice) - parsePriceValue(a.purchasePrice);
      if (priceDiff) return priceDiff;
      return String(a.name || '').localeCompare(String(b.name || ''), 'zh-Hans-CN');
    })
    .slice(0, limit);
}

/* ========== OVERALL STATS ========== */
function computeOverallStats() {
  let totalOwned = 0, totalAll = 0, totalCost = 0;
  SHEET_NAMES.forEach(s => {
    const data = allData[s] || [];
    const c = getCollected(s);
    totalAll += data.length;
    data.forEach(it => {
      if (c.includes(getItemKey(s, it.type, it.name))) {
        totalOwned++;
        totalCost += parsePriceValue(getPurchaseRecord(s, it.type, it.name).price);
      }
    });
  });
  return { owned: totalOwned, total: totalAll, cost: totalCost };
}
function updateOverallStats() {
  const { owned, total, cost } = computeOverallStats();
  document.getElementById("stat-owned").textContent = owned;
  document.getElementById("stat-total").textContent = total;
  document.getElementById("stat-missing").textContent = total - owned;
  document.getElementById("stat-cost").textContent = formatCurrency(cost);
  const pct = total ? Math.round(owned / total * 100) : 0;
  document.getElementById("stats-bar-fill").style.width = pct + "%";
  document.getElementById("stats-percent").textContent = pct + "%";
}

function buildCharTabs() {
  const wrap = document.getElementById("char-tabs");
  wrap.innerHTML = "";
  SHEET_NAMES.forEach(s => {
    const tab = document.createElement("div");
    tab.className = "char-tab";
    tab.style.setProperty("--tab-color", COLORS[s] || "#999");
    tab.addEventListener("click", () => switchSheet(s));
    tabEls[s] = tab;
    wrap.appendChild(tab);
  });
}

function updateCharTab(s) {
  const tab = tabEls[s];
  if (!tab) return;
  const data = allData[s] || [];
  const c = getCollected(s);
  const owned = data.filter(it => c.includes(getItemKey(s, it.type, it.name))).length;
  const total = data.length;
  const pct = total ? owned / total : 0;
  const R = 22, SW = 3, CIRC = 2 * Math.PI * R;
  const offset = CIRC * (1 - pct);
  tab.innerHTML = `
    <div class="char-tab-ring">
      <img src="${ICONS[s]}" alt="${s}" />
      <svg width="54" height="54">
        <circle cx="27" cy="27" r="${R}" stroke="#e8d5c4" stroke-width="${SW}" fill="none"/>
        <circle cx="27" cy="27" r="${R}" stroke="${COLORS[s]||'#999'}" stroke-width="${SW}" fill="none"
          stroke-dasharray="${CIRC.toFixed(2)}" stroke-dashoffset="${offset.toFixed(2)}" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="char-tab-name">${getSheetLabel(s)}</div>
    <div class="char-tab-count">${owned}/${total}</div>
  `;
  tab.classList.toggle("active", s === currentSheet);
}
function updateAllCharTabs() {
  SHEET_NAMES.forEach(s => updateCharTab(s));
}

/* ========== RENDER CARDS ========== */
function renderCards(sheet) {
  const main = document.getElementById("main-content");
  main.innerHTML = "";
  const data = allData[sheet] || [];
  if (!data.length) {
    main.innerHTML = `<div class="loading"><p>数据加载中…</p></div>`;
    return;
  }
  const grouped = {};
  data.forEach(it => {
    const t = it.type || "无类型";
    if (!grouped[t]) grouped[t] = [];
    grouped[t].push(it);
  });
  buildTypeNav(Object.keys(grouped));

  Object.keys(grouped).forEach(type => {
    const items = grouped[type];
    const section = document.createElement("div");
    section.className = "section-group";
    section.id = `section-${type}`;

    const header = document.createElement("div");
    header.className = "section-header";
    header.id = `hdr-${type}`;
    const c = getCollected(sheet);
    const owned = items.filter(it => c.includes(getItemKey(sheet, type, it.name))).length;
    header.innerHTML = `
      <span class="section-title">${toSimplifiedText(type)}</span>
      <span class="section-badge" id="badge-${type}">
        <span class="owned" id="owned-${type}">${owned}</span>/${items.length}
      </span>`;
    section.appendChild(header);

    const grid = document.createElement("div");
    grid.className = "card-grid";
    items.forEach(it => {
      const card = createCard(sheet, type, it);
      grid.appendChild(card);
    });
    section.appendChild(grid);
    main.appendChild(section);
  });

  applyFilterAndSearch();
}

function createCard(sheet, type, it) {
  const card = document.createElement("div");
  card.className = "card";
  const displayName = toSimplifiedText(it.name);
  const displayType = toSimplifiedText(type);
  const displaySize = toSimplifiedText(it.size || '');
  card.dataset.name = displayName.toLowerCase();
  card.dataset.type = type;
  card.style.setProperty("--card-color", COLORS[sheet] || "#d77485");
  const collected = isCollected(sheet, type, it.name);
  if (collected) card.classList.add("collected");
  const purchase = getPurchaseRecord(sheet, type, it.name);

  const safeName = displayName.length > 9
    ? displayName.slice(0, 9) + "<br>" + displayName.slice(9)
    : displayName;

  const priceDisplay = purchase.price ? `<span class="card-price">💰 ${formatPurchasePrice(purchase.price)}</span>` : '';
  const dateDisplay = purchase.date ? `<span class="card-date">📅 ${purchase.date}</span>` : '';
  const metaDisplay = (priceDisplay || dateDisplay) ? `<div class="card-meta">${priceDisplay}${dateDisplay}</div>` : '';
  const actionLabel = (purchase.price || purchase.date) ? '编辑购入' : '记录购入';
  const wishlistActive = isWishlisted(sheet, type, it.name);
  const wishlistLabel = wishlistActive ? '已计划' : '想入手';

  card.innerHTML = `
    <div class="card-check">
      <svg viewBox="0 0 16 16"><path d="M6 11.2L3.3 8.5l-1.4 1.4L6 14 14 6l-1.4-1.4z"/></svg>
    </div>
    <div class="card-img-wrap">
      <img src="${it.imgUrl || 'https://i.postimg.cc/bv5xRs04/image.png'}" alt="${displayName}" loading="lazy" />
    </div>
    <div class="card-name">${safeName}</div>
    <div class="card-size">${displaySize}</div>
    ${metaDisplay}
    <div class="card-actions">
      <button class="card-action-btn" type="button">${actionLabel}</button>
      <button class="card-wishlist-btn${wishlistActive ? ' active' : ''}" type="button">${wishlistLabel}</button>
      <button class="card-uncollect-btn" type="button">取消收藏</button>
    </div>
  `;

  card.querySelector(".card-action-btn").addEventListener("click", event => {
    event.preventDefault();
    event.stopPropagation();
    editPurchaseRecord(sheet, type, it);
  });

  card.querySelector(".card-wishlist-btn").addEventListener("click", event => {
    event.preventDefault();
    event.stopPropagation();
    if (isWishlisted(sheet, type, it.name)) {
      removeWishlistRecord(sheet, type, it.name);
      renderCards(sheet);
      return;
    }
    if (editWishlistRecord(sheet, type, it)) {
      renderCards(sheet);
    }
  });

  card.querySelector(".card-uncollect-btn").addEventListener("click", event => {
    event.preventDefault();
    event.stopPropagation();
    const nowCollected = toggleCollected(sheet, type, it.name);
    card.classList.toggle("collected", nowCollected);
    updateSectionBadge(sheet, type);
    updateCharTab(sheet);
    updateOverallStats();
    applyFilterAndSearch();
  });

  card.addEventListener("click", () => {
    const nowCollected = toggleCollected(sheet, type, it.name);
    card.classList.toggle("collected", nowCollected);
    if (nowCollected) {
      removeWishlistRecord(sheet, type, it.name);
      const wishlistBtn = card.querySelector(".card-wishlist-btn");
      if (wishlistBtn) {
        wishlistBtn.classList.remove("active");
        wishlistBtn.textContent = "想入手";
      }
      card.classList.add("just-collected");
      setTimeout(() => card.classList.remove("just-collected"), 450);
    }
    updateSectionBadge(sheet, type);
    updateCharTab(sheet);
    updateOverallStats();
    applyFilterAndSearch();
  });
  return card;
}

function editPurchaseRecord(sheet, type, item) {
  const current = getPurchaseRecord(sheet, type, item.name);
  const itemLabel = toSimplifiedText(item.name);
  const priceInput = window.prompt(`请输入「${itemLabel}」的购买金额（留空可跳过）`, current.price);
  if (priceInput === null) return;
  const dateInput = window.prompt(`请输入「${itemLabel}」的购买日期（如 2026-04-26，留空可跳过，输入 - 可清除）`, current.date);
  if (dateInput === null) return;

  const priceText = String(priceInput).trim();
  const dateText = String(dateInput).trim();

  const nextRecord = {
    price: priceText === '-' ? '' : priceText,
    date: dateText === '-' ? '' : (dateText ? dateText : current.date)
  };

  setPurchaseRecord(sheet, type, item.name, nextRecord);

  if (nextRecord.price || nextRecord.date) {
    const collected = getCollected(sheet);
    const key = getItemKey(sheet, type, item.name);
    if (!collected.includes(key)) {
      collected.push(key);
      setCollected(sheet, collected);
    }
    removeWishlistRecord(sheet, type, item.name);
  }

  if (sheet === currentSheet) {
    renderCards(sheet);
  }
  updateCharTab(sheet);
  updateOverallStats();
  applyFilterAndSearch();
}

function applyFilterAndSearch() {
  const q = searchQuery.toLowerCase();
  const sections = document.querySelectorAll(".section-group");
  sections.forEach(sec => {
    let anyVisible = false;
    sec.querySelectorAll(".card").forEach(card => {
      const matchSearch = !q || card.dataset.name.includes(q);
      const collected = card.classList.contains("collected");
      const matchFilter =
        currentFilter === "all" ||
        (currentFilter === "collected" && collected) ||
        (currentFilter === "uncollected" && !collected);
      const show = matchSearch && matchFilter;
      card.classList.toggle("hidden", !show);
      if (show) anyVisible = true;
    });
    sec.classList.toggle("all-hidden", !anyVisible);
  });

  // Show empty state if nothing visible
  const main = document.getElementById("main-content");
  let existingEmpty = main.querySelector(".empty-state");
  const anyVisible = [...document.querySelectorAll(".section-group")].some(s => !s.classList.contains("all-hidden"));
  if (!anyVisible && allData[currentSheet]?.length) {
    if (!existingEmpty) {
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.innerHTML = `<span class="emoji">🔍</span>没有符合条件的宝宝 ฅ(´• ω •\`)ฅ`;
      main.appendChild(empty);
    }
  } else if (existingEmpty) {
    existingEmpty.remove();
  }
}

/* ========== LOAD SHEET DATA ========== */
// CORS proxy list for China network compatibility
const PROXY_LIST = [
  "", // direct
  "https://api.allorigins.win/raw?url=",
  "https://api.codetabs.com/v1/proxy?quest=",
  "https://corsproxy.io/?",
  "https://api.allorigins.win/get?url=",
  "https://thingproxy.freeboard.io/fetch="
];

let proxyIndex = 0;

function getProxyUrl(originalUrl) {
  if (proxyIndex === 0) return originalUrl;
  return PROXY_LIST[proxyIndex] + encodeURIComponent(originalUrl);
}

function parseSheetData(text) {
  let raw = text;
  try {
    const wrapper = JSON.parse(text);
    if (wrapper && typeof wrapper.contents === 'string') raw = wrapper.contents;
  } catch {}
  const match = raw.match(/\{.*\}/s);
  if (!match) throw new Error("Invalid response");
  return JSON.parse(match[0]);
}

function processRows(data) {
  const rows = data.table.rows || [];
  return rows.map(row => normalizeSheetItem({
    type: row.c[0]?.v || "无类型",
    name: row.c[1]?.v || "",
    itemCode: row.c[2]?.v || "",
    imgUrl: row.c[3]?.v || "",
    productUrl: row.c[4]?.v || "",
    size: row.c[5]?.v || "",
    jpName: row.c[6]?.v || ""
  })).filter(Boolean);
}

function fetchSheetDataWithFallback(sheet) {
  const originalUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheet)}`;
  let attempt = 0;

  function tryNext() {
    if (attempt >= PROXY_LIST.length) {
      return Promise.reject(new Error(`All proxies failed for ${sheet}`));
    }
    const currentProxy = PROXY_LIST[attempt++];
    const url = currentProxy ? currentProxy + encodeURIComponent(originalUrl) : originalUrl;
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 15000);

    return fetch(url, { signal: controller.signal })
      .then(r => {
        clearTimeout(timeoutId);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return r.text();
      })
      .then(text => processRows(parseSheetData(text)))
      .catch(err => {
        clearTimeout(timeoutId);
        if (attempt >= PROXY_LIST.length) throw err;
        return tryNext();
      });
  }

  return tryNext();
}

function fetchAndCacheSheet(sheet) {
  if (sheetFetchPromises[sheet]) return sheetFetchPromises[sheet];
  if (sheetSynced[sheet] && Array.isArray(allData[sheet])) {
    return Promise.resolve(allData[sheet]);
  }

  const request = fetchSheetDataWithFallback(sheet)
    .then(rows => {
      allData[sheet] = rows;
      setCachedSheetData(sheet, rows);
      sheetSynced[sheet] = true;
      return rows;
    })
    .finally(() => {
      if (sheetFetchPromises[sheet] === request) {
        delete sheetFetchPromises[sheet];
      }
    });

  sheetFetchPromises[sheet] = request;
  return request;
}

function loadSheet(sheet, retryCount = 0) {
  const mainContent = document.getElementById("main-content");
  const loadingMarkup = `<div class="loading"><div class="dot"></div><div class="dot"></div><div class="dot"></div><p>宝宝加载中${retryCount > 0 ? ` (重试${retryCount})` : ""}…</p></div>`;
  const cachedData = getCachedSheetData(sheet);
  const existingData = Array.isArray(allData[sheet]) ? allData[sheet] : [];

  if (existingData.length) {
    renderCards(sheet);
  } else if (cachedData.length) {
    allData[sheet] = cachedData;
    renderCards(sheet);
    updateCharTab(sheet);
    updateOverallStats();
  } else if (mainContent) {
    mainContent.innerHTML = loadingMarkup;
  }

  fetchAndCacheSheet(sheet)
    .then(() => {
      if (sheet === currentSheet) {
        renderCards(sheet);
      }
      updateCharTab(sheet);
      updateOverallStats();
    })
    .catch(err => {
      console.error(`Load failed for ${sheet}:`, err);
      if (retryCount < 2) {
        delete sheetSynced[sheet];
        setTimeout(() => loadSheet(sheet, retryCount + 1), 2000);
      } else if (existingData.length || cachedData.length) {
        if (!existingData.length && cachedData.length) {
          allData[sheet] = cachedData;
        }
        if (sheet === currentSheet) {
          renderCards(sheet);
        }
        updateCharTab(sheet);
        updateOverallStats();
      } else {
        mainContent.innerHTML =
          `<div class="empty-state">
            <span class="emoji">😢</span>
            <div>加载失败，请检查网络连接</div>
            <div style="font-size:13px;color:#888;margin-top:8px;">
              暂时无法同步 JIWU 图鉴数据<br>
              请稍后刷新重试，或先使用本地缓存数据
            </div>
            <button onclick="location.reload()" style="margin-top:12px;padding:8px 16px;border:1px solid var(--accent);background:#fff;color:var(--accent);border-radius:99px;cursor:pointer;">🔄 刷新重试</button>
          </div>`;
      }
    });
}

/* Preload all sheets for tab counts */
function preloadAll() {
  SHEET_NAMES.forEach((s, idx) => {
    const cachedData = getCachedSheetData(s);
    if (cachedData.length && !allData[s]) {
      allData[s] = cachedData;
      updateCharTab(s);
      updateOverallStats();
    }
    setTimeout(() => {
      fetchAndCacheSheet(s)
        .then(() => {
          if (s === currentSheet) {
            renderCards(s);
          }
          updateCharTab(s);
          updateOverallStats();
        })
        .catch(err => {
          delete sheetSynced[s];
          console.warn(`Preload failed for ${s}:`, err);
        });
    }, idx * 500);
  });
}

/* ========== SWITCH SHEET ========== */
function switchSheet(sheet) {
  currentSheet = sheet;
  document.documentElement.style.setProperty("--accent", COLORS[sheet] || "#d77485");
  // reset filter & search on tab switch
  currentFilter = "all";
  searchQuery = "";
  document.getElementById("search-input").value = "";
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.toggle("active", b.dataset.filter === "all"));

  updateAllCharTabs();
  loadSheet(sheet);

  // Update URL
  const url = new URL(window.location);
  url.searchParams.set("tab", sheet);
  history.replaceState(null, "", url);
}

/* ========== INIT ========== */
function init() {
  applyStoredBackground();
  buildCharTabs();
  updateAllCharTabs();
  window.addEventListener("storage", event => {
    if (!event.key || BACKGROUND_STORAGE_KEYS.includes(event.key) || event.key === BACKGROUND_OPACITY_STORAGE_KEY) {
      applyStoredBackground();
    }
  });

  // Determine initial tab from URL
  const urlTab = new URLSearchParams(window.location.search).get("tab");
  currentSheet = SHEET_NAMES.includes(urlTab) ? urlTab : SHEET_NAMES[0];
  document.documentElement.style.setProperty("--accent", COLORS[currentSheet] || "#d77485");

  loadSheet(currentSheet);
  preloadAll();
  updateOverallStats();

  // Filter buttons
  document.querySelectorAll(".filter-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      currentFilter = btn.dataset.filter;
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      applyFilterAndSearch();
    });
  });

  // Search
  document.getElementById("search-input").addEventListener("input", e => {
    searchQuery = e.target.value.trim();
    applyFilterAndSearch();
  });

  // Reset button
  document.getElementById("reset-btn").addEventListener("click", () => {
    if (confirm(`确定要重置「${getSheetLabel(currentSheet)}」的图鉴吗？ฅ(๑*д*๑)ฅ`)) {
      setCollected(currentSheet, []);
      renderCards(currentSheet);
      updateCharTab(currentSheet);
      updateOverallStats();
      alert("✨图鉴重置完成！(˶ˆᗜˆ˵)");
    }
  });

  // Scroll to top button
  const toTopBtn = document.getElementById("toTopBtn");
  window.addEventListener("scroll", () => {
    toTopBtn.classList.toggle("visible", window.scrollY > 300);
  });
  toTopBtn.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));

  // My Collection button
  document.getElementById("my-collection-btn").addEventListener("click", showMyCollection);
  document.getElementById("share-progress-btn").addEventListener("click", showShareProgress);
  document.getElementById("wishlist-btn").addEventListener("click", showWishlistPlanner);
  document.getElementById("showcase-btn").addEventListener("click", showCollectionShowcase);
  document.getElementById("timeline-btn").addEventListener("click", showPurchaseTimeline);
  document.getElementById("background-settings-btn").addEventListener("click", showBackgroundSettings);
  document.getElementById("github-star-btn").addEventListener("click", showGithubStarSupport);
  document.getElementById("disclaimer-btn").addEventListener("click", showDisclaimer);
}

/* ========== MY COLLECTION MODAL ========== */
function showMyCollection() {
  const collected = getCollectedItems();

  const totalCost = collected.reduce((sum, it) => {
    const priceNum = parsePriceValue(it.purchasePrice);
    return sum + (isNaN(priceNum) ? 0 : priceNum);
  }, 0);

  const modal = document.createElement("div");
  modal.id = "collection-modal";
  modal.style.cssText = `
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.6); z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    padding: 20px; backdrop-filter: blur(4px);
  `;

  if (collected.length === 0) {
    modal.innerHTML = `
      <div style="background:#fff;border-radius:20px;padding:30px;max-width:400px;width:100%;text-align:center;">
        <div style="font-size:48px;margin-bottom:10px;">🎁</div>
        <h3 style="margin:0 0 10px;color:#5f3f3a;">还没有收藏任何宝宝哦</h3>
        <p style="color:#888;font-size:14px;margin:0 0 20px;">快去图鉴中点击卡片点亮收藏吧！</p>
        <button onclick="document.getElementById('collection-modal').remove()" style="padding:10px 24px;background:var(--accent);color:#fff;border:none;border-radius:99px;cursor:pointer;">知道了</button>
      </div>
    `;
  } else {
    const listHtml = collected.map(it => `
      <div style="display:flex;align-items:center;gap:12px;padding:10px;background:#fdf6f0;border-radius:12px;margin-bottom:8px;">
        <img src="${it.imgUrl || 'https://i.postimg.cc/bv5xRs04/image.png'}" style="width:50px;height:50px;border-radius:8px;object-fit:cover;background:#fff;" />
        <div style="flex:1;min-width:0;">
          <div style="font-weight:600;color:#5f3f3a;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${it.displayName || toSimplifiedText(it.name)}</div>
          <div style="font-size:12px;color:#888;">${it.sheetLabel} · ${it.displayType || toSimplifiedText(it.type)}</div>
          ${it.purchaseDate ? `<div style="font-size:11px;color:#999;">📅 ${it.purchaseDate}</div>` : ''}
        </div>
        <div style="text-align:right;">
          ${it.purchasePrice ? `<div style="font-weight:700;color:#e67e22;font-size:14px;">${formatPurchasePrice(it.purchasePrice)}</div>` : '<div style="font-size:12px;color:#bbb;">-</div>'}
        </div>
      </div>
    `).join('');

    modal.innerHTML = `
      <div style="background:#fff;border-radius:20px;max-width:500px;width:100%;max-height:80vh;display:flex;flex-direction:column;overflow:hidden;">
        <div style="padding:20px 20px 15px;border-bottom:1px solid #eee;background:linear-gradient(135deg,#fff6fa,#f5fbff);">
          <div style="display:flex;align-items:center;justify-content:space-between;">
            <h2 style="margin:0;color:#5f3f3a;font-size:18px;">⭐ 我的收藏 (${collected.length}个)</h2>
            <button onclick="document.getElementById('collection-modal').remove()" style="background:none;border:none;font-size:24px;cursor:pointer;color:#888;">×</button>
          </div>
          <div style="margin-top:10px;display:flex;gap:15px;font-size:13px;color:#666;">
            <span>总花费: <b style="color:#e67e22;font-size:16px;">${formatCurrency(totalCost)}</b></span>
          </div>
        </div>
        <div style="padding:15px 20px;overflow-y:auto;flex:1;">
          ${listHtml}
        </div>
        <div style="padding:15px 20px;border-top:1px solid #eee;background:#fafafa;">
          <button onclick="document.getElementById('collection-modal').remove()" style="width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:99px;cursor:pointer;font-size:14px;">关闭</button>
        </div>
      </div>
    `;
  }

  modal.addEventListener("click", (e) => {
    if (e.target === modal) modal.remove();
  });
  document.body.appendChild(modal);
}

document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
